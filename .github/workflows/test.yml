name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check sqlite3 CLI is available
        run: sqlite3 --version

      - name: Install engine dependencies
        run: npm install --prefix codegraph-ext/engine

      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Surface failure output as annotation
        if: failure()
        run: node -e 'const s=require("fs").readFileSync("test.log","utf8");const t=s.slice(-3000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error::"+t)'
